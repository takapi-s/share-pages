name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_NAME: share-pages-pr-${{ github.event.pull_request.number }}
      PREVIEW_URL: https://share-pages-pr-${{ github.event.pull_request.number }}.pocky1111gm.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Deploy PR Worker
        run: >-
          npx --yes wrangler@4.114.0 deploy
          --env staging
          --name "$PREVIEW_NAME"
          --var SHARE_PAGES_ORIGIN:$PREVIEW_URL
      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_NAME: ${{ env.PREVIEW_NAME }}
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const marker = '<!-- share-pages-preview -->';
            const body = `${marker}\n🚀 **share-pages preview**\n\n- Worker: \`${process.env.PREVIEW_NAME}\`\n- URL: ${process.env.PREVIEW_URL}\n- R2: staging bucket\n\nThis preview is deployed from commit \`${context.sha.slice(0, 7)}\`. It is replaced on the next push to this PR.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_NAME: share-pages-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Delete PR Worker
        run: npx --yes wrangler@4.114.0 delete --name "$PREVIEW_NAME" --force
      - name: Mark preview as closed
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- share-pages-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n🧹 **share-pages preview deleted**\n\nThe preview Worker for this PR was removed after the PR was closed.`,
              });
            }
